version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: postgres_evaluacion
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: refugio
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis_db:
    image: redis/redis-stack:latest
    container_name: redis_evaluacion
    ports:
      - "6379:6379"
      - "8001:8001"